name: cloud-partnerops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:-partnerops_migrate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpo-pg-1}
      POSTGRES_DB: ${POSTGRES_DB:-partnerops}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_MIGRATION_USER:-partnerops_migrate} -d ${POSTGRES_DB:-partnerops}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cpo]

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-cpo-redis-1}
    # shell form: exec expands $REDIS_PASSWORD (exec-form command would not)
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy allkeys-lru'
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [cpo]


  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-***-minio-1}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cpo]

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://partnerops:${POSTGRES_APP_PASSWORD:-cpo-app}@postgres:5432/${POSTGRES_DB:-partnerops}
      DATABASE_URL_MIGRATE: postgresql+psycopg://partnerops_migrate:${POSTGRES_PASSWORD:-cpo-pg-1}@postgres:5432/${POSTGRES_DB:-partnerops}
      REDIS_URL: redis://:${REDIS_PASSWORD:-cpo-redis-1}@redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
    command: >
      sh -c "
      alembic upgrade head &&
      python -m app.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [cpo]

  worker:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://partnerops:${POSTGRES_APP_PASSWORD:-cpo-app}@postgres:5432/${POSTGRES_DB:-partnerops}
      REDIS_URL: redis://:${REDIS_PASSWORD:-cpo-redis-1}@redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
    command: celery -A app.tasks worker -Q default,pricing,ingestion --loglevel=info
    depends_on:
      api:
        condition: service_started
    networks: [cpo]

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    networks: [cpo]

volumes:
  pgdata:
  miniodata:

networks:
  cpo:
    driver: bridge
